version: 2

models:
  - name: int_sales_database__order_item
    description: >
      One row per order line item, enriched with order-level attributes
      (customer, store, staff, status, dates) and the calculated line
      revenue. This is the single source of truth for revenue: no other
      model recomputes quantity x price x (1 - discount).
    columns:
      - name: order_item_id
        description: "Primary key, inherited from staging."
        tests: [unique, not_null]
      - name: order_item_revenue_amount
        description: "Revenue generated by this line: order_item_quantity x order_item_list_price x (1 - order_item_discount_rate)."
        tests: [not_null]
      - name: is_completed_order
        description: "True when the parent order's status is 4 (completed/shipped). Business rule established in Phase 1/2: only completed orders count toward official revenue KPIs."
        tests: [not_null]